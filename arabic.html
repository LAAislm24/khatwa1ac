  function openAr(id) {
    var item = Reflect.get(arData, id);
    document.getElementById('ar_home').style.display = 'none';
    document.getElementById('ar_view').style.display = 'block';
    document.getElementById('ar_title').innerText = item.t;
    var html = '';
    item.d.split('|').forEach(function(txt) {
      if (txt.includes('::')) {
        var parts = txt.split('::');
        html += '<button class="lesson-btn" style="border-color:#eab308; color:#fde047;" onclick="location.href=\'ar_u1_all.html#' + parts.at(0) + '\'">🏆 ' + parts.at(1) + '</button>';
      } else {
        html += '<button class="lesson-btn">• ' + txt + '</button>';
      }
    });
    document.getElementById('ar_list').innerHTML = html;
  }
  function backAr() {
    document.getElementById('ar_view').style.display = 'none';
    document.getElementById('ar_home').style.display = 'block';
  }

</head>
